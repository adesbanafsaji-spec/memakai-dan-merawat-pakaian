<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aku Pandai Berpakaian - MPI Ruang Murid</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1b2a;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;color:#1a1a2e}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#bfe3f5 center/cover no-repeat;overflow:hidden}

/* header */
#hdr{position:absolute;left:24px;right:24px;top:10px;height:60px;display:flex;align-items:center;gap:14px;z-index:5}
#htitle{background:#fff;border:3px solid #0d3b66;border-radius:30px;padding:0 22px;height:52px;line-height:46px;font-weight:800;font-size:23px;color:#0d3b66;white-space:nowrap}
#prog{flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #0d3b66;border-radius:30px;height:52px;padding:0 18px}
#pbar{flex:1;height:18px;background:#d6e4f0;border-radius:10px;overflow:hidden;border:2px solid #0d3b66}
#pfill{display:block;height:100%;width:0;background:#1f8a3b;transition:width .4s}
#plabel{font-weight:800;font-size:20px;color:#0d3b66;white-space:nowrap}
.ib{width:52px;height:52px;border-radius:50%;border:3px solid #0d3b66;background:#fff;font-size:26px;padding:0}
.ib.off{opacity:.5}

/* view */
#view{position:absolute;left:30px;right:30px;top:80px;bottom:92px;z-index:2}
#stage.s-cover #view{left:0;right:0;top:0;bottom:0}
#view.leave{opacity:0;transform:translateX(-40px);transition:opacity .22s,transform .22s}
#view.enter{animation:vin .38s ease}
@keyframes vin{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}

/* nav */
#nav{position:absolute;left:30px;right:30px;bottom:14px;height:66px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.btn{border:0;border-bottom:6px solid rgba(0,0,0,.3);border-radius:20px;color:#fff;font-weight:800;font-size:26px;height:62px;min-width:190px;padding:0 26px}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.b-back{background:#b34700}
.b-say{background:#0d3b66}
.b-next{background:#1b7a35}
.btn.off{background:#7a7a7a;color:#eee}
.btn.sm{height:50px;font-size:21px;min-width:0;padding:0 18px;flex:none}
#stage.s-cover #hdr,#stage.s-cover #nav,#stage.s-name #nav,#stage.s-menu #nav{display:none}
#stage.s-name #prog,#stage.s-menu #prog,#stage.s-single #prog{visibility:hidden}
#stage.s-name #btnHome,#stage.s-menu #btnHome{visibility:hidden}
#stage.s-single #bNext,#stage.s-single #bSay{visibility:hidden}
#toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:#0d3b66;color:#fff;font-size:24px;font-weight:700;padding:14px 28px;border-radius:30px;border:3px solid #fff;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}

/* cover */
.cover{position:absolute;inset:0;cursor:pointer}
.tapmsg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:17px;padding:6px 18px;border-radius:16px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.45}}

/* cards */
.card{height:100%;background:rgba(255,255,255,.95);border:4px solid #0d3b66;border-radius:28px;padding:16px 26px;overflow:auto}
.card.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h2{margin:0 0 4px;font-size:34px;color:#0d3b66}
.sub{margin:0 0 10px;font-size:22px;color:#222}
.big{font-size:28px;margin:8px 0}
.bigrow{font-size:80px;letter-spacing:10px}
.goals{list-style:none;padding:0;margin:6px 0;font-size:30px;font-weight:700;text-align:left}
.goals li{margin:10px 0}
.sum{font-size:28px;text-align:left;line-height:1.5;margin:0;padding-left:0;list-style:none}
.sum li{margin:8px 0}
.numrow{display:flex;gap:16px;justify-content:center;margin:12px 0}
.nc{width:78px;height:78px;border-radius:50%;background:#6a1b9a;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;border:4px solid #fff;box-shadow:0 0 0 3px #6a1b9a}

/* explore */
.xwrap{display:flex;gap:20px;height:calc(100% - 82px)}
.xgrid{display:grid;gap:14px;width:730px;align-content:start}
.xcard{background:#fff;border:4px solid #1565c0;border-radius:22px;min-height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#0d3b66;font-weight:800;font-size:22px;padding:6px;position:relative}
.xcard .xe{font-size:54px;line-height:1}
.xcard.seen{background:#e1f5e5;border-color:#1b7a35}
.xcard.seen::after{content:"✓";position:absolute;right:10px;top:4px;color:#1b7a35;font-size:28px}
.xcard.act{box-shadow:0 0 0 5px #f2b400}
.xinfo{flex:1;border:4px dashed #1565c0;border-radius:22px;background:#f3f9ff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px}
.xhint{font-size:28px;font-weight:700;color:#1565c0}
.xbig{font-size:96px;line-height:1.1}
.xinfo h3{margin:4px 0;font-size:32px;color:#0d3b66}
.xinfo p{margin:6px 0;font-size:26px;line-height:1.35}
.nbadge{display:inline-block;background:#6a1b9a;color:#fff;border-radius:50%;width:38px;height:38px;line-height:38px;font-size:24px;margin-right:6px}

/* quiz */
.qhead{font-size:20px;font-weight:800;color:#6a1b9a}
.qemo{font-size:84px;line-height:1.1;text-align:center}
.qtext{font-size:32px;font-weight:800;text-align:center;margin:4px 0 12px;color:#0d3b66}
.opts{display:flex;gap:18px}
.opt{flex:1;min-height:128px;font-size:30px;font-weight:800;border:5px solid #0d3b66;background:#fff;color:#0d3b66;border-radius:24px;padding:8px}
.opt.good{background:#c8f2d1;border-color:#1b7a35}
.opt.bad{background:#ffd6d2;border-color:#c62828;opacity:.8}
.fb{min-height:20px;margin-top:12px;border-radius:18px;padding:0;font-size:23px;font-weight:600;display:flex;align-items:center;gap:12px}
.fb.ok,.fb.no{padding:10px 16px}
.fb.ok{background:#d9f5df;color:#0b4a1d;border:3px solid #1b7a35}
.fb.no{background:#ffe3e0;color:#7a0f05;border:3px solid #c62828}
.fb .fe{font-size:38px}
.fb span+span{flex:1}

/* order */
.owrap{display:flex;gap:20px}
.oslots{width:560px;display:flex;flex-direction:column;gap:7px}
.oslot{height:50px;border:3px dashed #7a8aa0;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 10px;font-size:22px;font-weight:700;background:#f3f6fa}
.oslot b{width:36px;height:36px;border-radius:50%;background:#6a1b9a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.oslot.on{border:3px solid #1b7a35;background:#e1f5e5;color:#0b4a1d}
.ocards{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.ocard{background:#fff;border:4px solid #1565c0;border-radius:18px;min-height:84px;font-size:21px;font-weight:800;color:#0d3b66;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ocard .xe{font-size:34px;line-height:1}
.ocard.used{visibility:hidden}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* match */
.mwrap{display:flex;gap:60px;justify-content:center;margin-top:4px}
.mcol{width:480px;display:flex;flex-direction:column;gap:12px}
.mbtn{min-height:76px;border:4px solid #1565c0;background:#fff;border-radius:20px;font-size:26px;font-weight:800;color:#0d3b66;display:flex;align-items:center;justify-content:center;gap:12px}
.mbtn.r{border-color:#b34700}
.mbtn.sel{box-shadow:0 0 0 6px #f2b400}
.mbtn.done{background:#c8f2d1;border-color:#1b7a35;color:#0b4a1d}
.mbtn .xe{font-size:40px}

/* menu */
.menutop{height:96px;background:rgba(255,255,255,.95);border:4px solid #0d3b66;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.menutop h2{font-size:36px;margin:0}
.menutop div{font-size:24px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;height:calc(100% - 112px);margin-top:16px}
.tile{border:0;border-bottom:8px solid rgba(0,0,0,.3);border-radius:28px;color:#fff;font-size:30px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.tile:active{transform:translateY(4px);border-bottom-width:4px}
.tile .te{font-size:62px;line-height:1}
.tile small{font-size:19px;font-weight:600;opacity:.95}

/* name */
.nameinp{font-size:44px;font-weight:800;text-align:center;border:5px solid #0d3b66;border-radius:24px;padding:12px 20px;width:640px;color:#0d3b66;-webkit-user-select:text;user-select:text;background:#fff}

/* rank */
table{width:100%;border-collapse:collapse;font-size:25px}
th{background:#0d3b66;color:#fff;padding:10px;position:sticky;top:-16px}
td{padding:9px 12px;border-bottom:2px solid #cfd8e3;text-align:center;font-weight:700}
td.nm{text-align:left}
tr.me td{background:#fff2b3}

/* dev */
.devwrap{display:flex;align-items:center;justify-content:center;gap:50px;height:100%}
.devphoto{width:320px;height:380px;border:6px solid #0d3b66;border-radius:28px;object-fit:cover;background:#e3eefa;display:flex;align-items:center;justify-content:center;font-size:150px}
.devtxt h2{font-size:42px}
.devtxt p{font-size:30px;margin:8px 0;font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <div id="hdr">
    <div id="htitle"></div>
    <div id="prog"><div id="pbar"><i id="pfill"></i></div><span id="plabel"></span></div>
    <button class="ib" id="btnMusic" aria-label="Musik">🔊</button>
    <button class="ib" id="btnHome" aria-label="Menu utama">🏠</button>
  </div>
  <div id="view"></div>
  <div id="nav">
    <button class="btn b-back" id="bBack">◀ Kembali</button>
    <button class="btn b-say" id="bSay">🔈 Dengarkan</button>
    <button class="btn b-next" id="bNext">Lanjut ▶</button>
  </div>
  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var stage=$("#stage"), view=$("#view");
var A={ok:"./assets/benar.mp3",no:"./assets/salah.mp3"};

/* ---------- scaling 16:9 ---------- */
function fit(){
  var s=Math.min(window.innerWidth/1280,window.innerHeight/720);
  stage.style.transform="scale("+s+")";
  stage.style.left=((window.innerWidth-1280*s)/2)+"px";
  stage.style.top=((window.innerHeight-720*s)/2)+"px";
}
window.addEventListener("resize",fit); fit();

/* ---------- audio manager ---------- */
var bgm=new Audio("./assets/musiklatar.mp3"); bgm.loop=true; bgm.volume=0.3;
var musicOn=true, started=false, busy=0;
var SS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function resumeBgm(){ if(musicOn&&started&&busy===0&&!document.hidden){ try{var p=bgm.play(); if(p&&p.catch)p.catch(function(){});}catch(e){} } }
function duck(){ busy++; try{bgm.pause();}catch(e){} }
function unduck(){ busy=Math.max(0,busy-1); if(busy===0)resumeBgm(); }
var curU=null, curSfx=null;
function stopSpeak(){ if(curU){var h=curU; curU=null; h.fin();} if(SS){try{speechSynthesis.cancel();}catch(e){}} }
function stopSfx(){ if(curSfx){var c=curSfx; curSfx=null; try{c.a.pause();}catch(e){} c.fin(false);} }
function stopAudio(){ stopSpeak(); stopSfx(); }
function speak(txt){
  if(!SS||!txt)return;
  stopSpeak();
  var u; try{u=new SpeechSynthesisUtterance(txt);}catch(e){return;}
  u.lang="id-ID"; u.rate=0.85; u.pitch=1.1;
  try{var vs=speechSynthesis.getVoices(); for(var i=0;i<vs.length;i++){ if(/^id/i.test(vs[i].lang)){u.voice=vs[i];break;} }}catch(e){}
  var d=false, h={fin:function(){ if(d)return; d=true; clearTimeout(h.t); if(curU===h)curU=null; unduck(); }};
  curU=h; duck(); u.onend=h.fin; u.onerror=h.fin;
  h.t=setTimeout(h.fin,2500+txt.length*120);
  try{speechSynthesis.speak(u);}catch(e){h.fin();}
}
function sfx(src,cb){
  stopSpeak(); stopSfx();
  var a=new Audio(src), d=false;
  var fin=function(call){ if(d)return; d=true; clearTimeout(t); if(curSfx&&curSfx.a===a)curSfx=null; if(call&&cb)cb(); unduck(); };
  var t=setTimeout(function(){fin(true);},7000);
  duck();
  a.onended=function(){fin(true);}; a.onerror=function(){fin(true);};
  curSfx={a:a,fin:fin};
  try{var p=a.play(); if(p&&p.catch)p.catch(function(){fin(true);});}catch(e){fin(true);}
}
document.addEventListener("visibilitychange",function(){ if(document.hidden){try{bgm.pause();}catch(e){}} else resumeBgm(); });
$("#btnMusic").addEventListener("click",function(){
  musicOn=!musicOn; this.textContent=musicOn?"🔊":"🔇"; this.classList.toggle("off",!musicOn);
  if(musicOn)resumeBgm(); else {try{bgm.pause();}catch(e){}}
});

/* ---------- utils ---------- */
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
var toastT;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},1900); }

/* ---------- penyimpanan peringkat (lokal) ---------- */
var KEY="mpi_pakaianku_rank_v1", mem=[];
function loadR(){ try{var r=JSON.parse(localStorage.getItem(KEY)); if(r&&r.length!==undefined){mem=r;return r;}}catch(e){} return mem; }
function saveR(a){ mem=a; try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){} }
function findR(a,n){ for(var i=0;i<a.length;i++){ if(a[i].n.toLowerCase()===n.toLowerCase())return a[i]; } return null; }
function regPlayer(n){ var a=loadR(); if(!findR(a,n)){a.push({n:n,l:null,m:null}); saveR(a);} }
function setScore(n,k,s){ var a=loadR(), r=findR(a,n); if(!r){r={n:n,l:null,m:null}; a.push(r);} if(r[k]===null||s>r[k])r[k]=s; saveR(a); }

/* ---------- state & layout ---------- */
var player="", cur=null, navLock=false, navMode="none";
function setMode(m){
  stage.className="s-"+m;
  stage.style.backgroundImage="url('./assets/"+(m==="cover"?"cover.png":"latar1.png")+"')";
}
function swap(fn){
  if(navLock)return; navLock=true; stopAudio();
  view.classList.remove("enter"); view.classList.add("leave");
  setTimeout(function(){
    try{ view.classList.remove("leave"); view.scrollTop=0; fn(view); }
    finally{ void view.offsetWidth; view.classList.add("enter"); setTimeout(function(){navLock=false;},60); }
  },230);
}
function setHdr(t){ $("#htitle").textContent=t; }

/* ---------- komponen interaksi ---------- */
function explore(v,a,o){
  var seen={}, n=0, tot=o.items.length;
  v.innerHTML='<div class="card"><h2>'+o.title+'</h2><p class="sub">'+o.sub+' <b id="cnt">0</b> / '+tot+'</p><div class="xwrap"><div class="xgrid" style="grid-template-columns:repeat('+o.cols+',1fr)">'+
    o.items.map(function(it,i){return '<button class="xcard" data-i="'+i+'"><span class="xe">'+it.e+'</span><span>'+(o.num?'<span class="nbadge">'+(i+1)+'</span>':'')+it.t+'</span></button>';}).join("")+
    '</div><div class="xinfo" id="xi"><div class="xhint">👆 Sentuh satu kartu</div></div></div></div>';
  var cards=v.querySelectorAll(".xcard");
  Array.prototype.forEach.call(cards,function(c){
    c.addEventListener("click",function(){
      var i=+c.dataset.i, it=o.items[i];
      Array.prototype.forEach.call(cards,function(x){x.classList.remove("act");});
      c.classList.add("act"); c.classList.add("seen");
      if(!seen[i]){seen[i]=1;n++; v.querySelector("#cnt").textContent=n;}
      var say=(o.num?"Langkah ke "+(i+1)+". ":"")+it.t+". "+it.d;
      v.querySelector("#xi").innerHTML='<div class="xbig">'+it.e+'</div><h3>'+(o.num?'<span class="nbadge">'+(i+1)+'</span>':'')+it.t+'</h3><p>'+it.d+'</p>';
      cur.say=say; speak(say);
      if(n===tot){ a.done(1); }
    });
  });
}

function quiz(v,a,items,o){
  o=o||{}; var i=0, good=0;
  function show(){
    stopAudio();
    var q=items[i], locked=false, wrongOnce=false;
    v.innerHTML='<div class="card"><div class="qhead">'+(o.head||("Soal "+(i+1)+" dari "+items.length))+'</div><div class="qemo">'+q.e+'</div><div class="qtext">'+q.q+'</div><div class="opts">'+
      q.o.map(function(t,k){return '<button class="opt" data-k="'+k+'">'+t+'</button>';}).join("")+'</div><div class="fb" id="fb"></div></div>';
    var fb=v.querySelector("#fb"), btns=v.querySelectorAll(".opt");
    cur.say=q.q; setTimeout(function(){ if(cur&&cur.say===q.q&&!locked)speak(q.q); },450);
    function finishQ(ok){
      if(i<items.length-1){
        var b=document.createElement("button"); b.className="btn b-next sm"; b.textContent="Soal berikutnya ▶";
        b.addEventListener("click",function(){i++;show();}); fb.appendChild(b);
      } else a.done(good);
    }
    Array.prototype.forEach.call(btns,function(b){
      b.addEventListener("click",function(){
        if(locked||b.classList.contains("bad"))return;
        var k=+b.dataset.k;
        if(k===q.a){
          locked=true; b.classList.add("good"); if(!wrongOnce)good++;
          fb.className="fb ok"; fb.innerHTML='<span class="fe">🎉</span><span><b>Benar!</b> '+q.w+'</span>';
          sfx(A.ok,function(){speak("Benar! "+q.w);}); finishQ(true);
        } else if(o.retry){
          wrongOnce=true; b.classList.add("bad");
          var hint=q.x||"Ayo coba lagi!";
          fb.className="fb no"; fb.innerHTML='<span class="fe">🤔</span><span><b>Belum tepat.</b> '+hint+' Coba pilih yang lain ya.</span>';
          sfx(A.no,function(){speak("Belum tepat. "+hint+" Coba pilih yang lain ya.");});
        } else {
          locked=true; b.classList.add("bad"); btns[q.a].classList.add("good");
          fb.className="fb no"; fb.innerHTML='<span class="fe">💡</span><span><b>Belum tepat.</b> Jawaban yang benar: '+btns[q.a].textContent+'. '+q.w+'</span>';
          sfx(A.no,function(){speak("Belum tepat. "+q.w);}); a.done(0);
        }
      });
    });
    if(o.play){ /* mode bermain: satu soal per halaman, buka kunci setelah dijawab benar */
      Array.prototype.forEach.call(btns,function(b){ b.addEventListener("click",function(){ if(+b.dataset.k===q.a)a.done(1); }); });
    }
  }
  show();
}

function order(v,a,o){
  var n=o.steps.length, nxt=0, mist=0, fin=false;
  var idx=o.steps.map(function(_,i){return i;});
  do{idx=shuffle(idx);}while(idx.every(function(x,i){return x===i;}));
  v.innerHTML='<div class="card"><h2>'+o.title+'</h2><p class="sub">'+o.sub+'</p><div class="owrap"><div class="oslots">'+
    o.steps.map(function(s,i){return '<div class="oslot" id="os'+i+'"><b>'+(i+1)+'</b><span class="ot"></span></div>';}).join("")+
    '</div><div class="ocards">'+idx.map(function(i){return '<button class="ocard" data-i="'+i+'"><span class="xe">'+o.steps[i].e+'</span>'+o.steps[i].t+'</button>';}).join("")+
    '</div></div><div class="fb" id="fb"></div></div>';
  var fb=v.querySelector("#fb");
  Array.prototype.forEach.call(v.querySelectorAll(".ocard"),function(b){
    b.addEventListener("click",function(){
      if(fin||b.classList.contains("used"))return;
      var i=+b.dataset.i, s=o.steps[i];
      if(i===nxt){
        b.classList.add("used");
        var sl=v.querySelector("#os"+nxt); sl.classList.add("on"); sl.querySelector(".ot").textContent=s.e+" "+s.t;
        var msg="Langkah ke "+(nxt+1)+": "+s.t+". "+s.d;
        nxt++;
        if(nxt===n){ fin=true; msg+=" Hebat! Semua langkah sudah berurutan."; a.done(mist===0?1:0); }
        fb.className="fb ok"; fb.innerHTML='<span class="fe">🎉</span><span><b>Benar!</b> '+msg+'</span>';
        sfx(A.ok,function(){speak("Benar! "+msg);});
      } else {
        mist++; b.classList.add("shake"); setTimeout(function(){b.classList.remove("shake");},450);

function match(v,a,o){
  var ps=o.pairs, sel=null, ok=0, mist=0;
  var rs=shuffle(ps.map(function(_,i){return i;}));
  v.innerHTML='<div class="card"><h2>'+o.title+'</h2><p class="sub">'+o.sub+'</p><div class="mwrap"><div class="mcol">'+
    ps.map(function(p,i){return '<button class="mbtn" data-s="l" data-i="'+i+'"><span class="xe">'+p.e+'</span>'+p.l+'</button>';}).join("")+
    '</div><div class="mcol">'+rs.map(function(i){return '<button class="mbtn r" data-s="r" data-i="'+i+'">'+ps[i].r+'</button>';}).join("")+
    '</div></div><div class="fb" id="fb"></div></div>';
  var fb=v.querySelector("#fb"), L=v.querySelectorAll('[data-s="l"]'), R=v.querySelectorAll('[data-s="r"]');
  function find(list,i){ for(var k=0;k<list.length;k++){ if(+list[k].dataset.i===i)return list[k]; } }
  Array.prototype.forEach.call(L,function(b){
    b.addEventListener("click",function(){
      if(b.classList.contains("done"))return;
      Array.prototype.forEach.call(L,function(x){x.classList.remove("sel");});
      b.classList.add("sel"); sel=+b.dataset.i;
      fb.className="fb"; fb.innerHTML="";
    });
  });
  Array.prototype.forEach.call(R,function(b){
    b.addEventListener("click",function(){
      if(b.classList.contains("done"))return;
      if(sel===null){ toast("Pilih pakaian di kiri dulu ya"); return; }
      var i=+b.dataset.i;
      if(i===sel){
        b.classList.add("done"); var l=find(L,sel); l.classList.remove("sel"); l.classList.add("done");
        ok++; var msg=ps[sel].w; sel=null;
        fb.className="fb ok"; fb.innerHTML='<span class="fe">🎉</span><span><b>Cocok!</b> '+msg+'</span>';
        sfx(A.ok,function(){speak("Cocok! "+msg);});
        if(ok===ps.length)a.done(mist===0?1:0);
      } else {
        mist++; var m2="Belum cocok. "+ps[sel].w;
        fb.className="fb no"; fb.innerHTML='<span class="fe">🤔</span><span><b>Belum cocok.</b> '+ps[sel].w+'</span>';
        sfx(A.no,function(){speak(m2);});
      }
    });
  });
}

  mq("👕","Langkah pertama memakai baju adalah...",["🙆 Masukkan kepala","👕 Ambil baju bersih","✨ Rapikan baju"],1,"Langkah ke-1 adalah mengambil baju yang bersih."),
  mq("🔢","Berapa jumlah semua langkah memakai baju?",["4","5","6"],1,"Ada 5 langkah: ambil, kepala, tangan kanan, tangan kiri, rapikan."),
  {speak:"Urutkan langkah memakai baju.",run:function(v,a,head){ order(v,a,{title:"Urutkan: Memakai Baju",sub:head+" - Sentuh langkah nomor 1 sampai 5.",steps:WEAR}); }},
  mq("🧼","Merawat baju, langkah ke-3 adalah...",["🧼 Cuci dengan sabun","☀️ Jemur","🧺 Masukkan keranjang"],0,"Urutan merawat: 1 lepas, 2 keranjang, 3 cuci."),
  mq("☀️","Setelah menjemur (langkah 4), langkah ke-5 adalah...",["🗄️ Simpan di lemari","🤲 Lipat baju","🧼 Cuci baju"],1,"Setelah dijemur, baju dilipat. Itu langkah ke-5."),
  {speak:"Urutkan langkah merawat baju.",run:function(v,a,head){ order(v,a,{title:"Urutkan: Merawat Baju",sub:head+" - Sentuh langkah nomor 1 sampai 6.",steps:CARE}); }},
  mq("🗄️","Langkah terakhir merawat baju adalah langkah ke...",["5","6","7"],1,"Ada 6 langkah. Langkah ke-6, yang terakhir, adalah menyimpan baju di lemari.")
 ];
 return playPages("Bermain Numerasi",T,"pnum");
}

var SECS={
 lit:{title:"Belajar Literasi",mode:"learn",pages:litPages},
 num:{title:"Belajar Numerasi",mode:"learn",pages:numPages},
 plit:{title:"Bermain Literasi",mode:"play",pages:playLitPages},
 pnum:{title:"Bermain Numerasi",mode:"play",pages:playNumPages}
};
var SECSTORE={plit:"l",pnum:"m"};

/* ---------- navigasi bagian ---------- */
function startSec(key){
  var s=SECS[key];
  cur={key:key,mode:s.mode,pages:s.pages(),idx:0,done:{},correct:0,say:""};
  goPage(0);
}
function goPage(i){
  swap(function(v){
    setMode("sec"); cur.idx=i; setHdr(SECS[cur.key].title);
    var p=cur.pages[i], idx=i;
    var api={done:function(x){ if(cur.done[idx]||cur.idx!==idx)return; cur.done[idx]=true; if(p.onDone)p.onDone(x); updateNav(); }};
    cur.say=(typeof p.speak==="function")?p.speak():(p.speak||"");
    p.render(v,api);
    updateNav();
    var st=cur.say; if(st)setTimeout(function(){ if(cur&&cur.idx===idx&&cur.say===st)speak(st); },450);
  });
}
function updateNav(){
  var p=cur.pages[cur.idx], n=cur.pages.length, last=cur.idx===n-1;
  $("#pfill").style.width=((cur.idx+1)/n*100)+"%";
  $("#plabel").textContent="Langkah "+(cur.idx+1)+" dari "+n;
  var nb=$("#bNext"); nb.textContent=last?(cur.mode==="play"?"Menu ✔":"Selesai ✔"):"Lanjut ▶";
  var locked=p.gate&&!cur.done[cur.idx]; nb.classList.toggle("off",!!locked);
  var bb=$("#bBack"); bb.classList.toggle("off",cur.mode==="play"&&cur.idx>0);
  navMode="sec";
}
$("#bNext").addEventListener("click",function(){
  if(navMode!=="sec"||!cur||navLock)return;
  var p=cur.pages[cur.idx];
  if(p.gate&&!cur.done[cur.idx]){ toast("Selesaikan kegiatan ini dulu ya!"); return; }
  if(cur.idx===cur.pages.length-1)showMenu(); else goPage(cur.idx+1);
});
$("#bBack").addEventListener("click",function(){
  if(navLock)return;
  if(navMode==="single"){showMenu();return;}
  if(!cur)return;
  if(cur.idx===0)showMenu();
  else if(cur.mode==="play"){ toast("Selesaikan permainan dulu ya!"); }
  else goPage(cur.idx-1);
});
$("#bSay").addEventListener("click",function(){ if(cur&&cur.say)speak(cur.say); });
$("#btnHome").addEventListener("click",function(){ if(!navLock)showMenu(); });

/* ---------- layar-layar ---------- */
function showCover(){
  setMode("cover"); navMode="none"; setHdr("");
  view.innerHTML='<div class="cover" id="cv"><div class="tapmsg">sentuh mana saja untuk masuk</div></div>';
  view.classList.add("enter");
  $("#cv").addEventListener("click",function(){
    started=true; resumeBgm(); showName();
  });
}
function showName(){
  swap(function(v){
    setMode("name"); navMode="none"; cur=null; setHdr("Pakaianku");
    v.innerHTML='<div class="card center"><div class="bigrow">✏️</div><h2>Siapa namamu?</h2><p class="big">Tulis namamu, lalu sentuh Mulai.</p><input class="nameinp" id="nm" maxlength="20" placeholder="Tulis namamu" autocomplete="off" value="'+player.replace(/"/g,"")+'"><div style="margin-top:18px"><button class="btn b-next" id="go">Mulai ▶</button></div></div>';
    var inp=v.querySelector("#nm");
    function go(){
      var n=inp.value.replace(/[<>&"]/g,"").replace(/\s+/g," ").trim();
      if(!n){ toast("Tulis namamu dulu ya"); return; }
      player=n; regPlayer(n); showMenu();
    }
    v.querySelector("#go").addEventListener("click",go);
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter")go(); });
    speak("Siapa namamu? Tulis namamu, lalu sentuh Mulai.");
  });
}
function showMenu(){
  if(!player){showName();return;}
  swap(function(v){
    setMode("menu"); navMode="none"; cur=null; setHdr("Menu Utama");
    var T=[
     ["lit","📖","Belajar Literasi","Kapan & cara memakai, merawat","#1565c0"],
     ["num","🔢","Belajar Numerasi","Langkah-langkah berurutan","#6a1b9a"],
     ["plit","🎯","Bermain Literasi","Latihan soal bahasa","#2e7d32"],
     ["pnum","🧮","Bermain Numerasi","Latihan soal berhitung","#c2410c"],
     ["rank","🏆","Papan Peringkat","Lihat nilai teman-teman","#8a5a00"],
     ["dev","👩‍🏫","Pengembang","Kenali pembuat materi","#455a64"]
    ];
    v.innerHTML='<div class="menutop"><h2>Aku Pandai Berpakaian</h2><div>Halo, '+player+'! 👋 Memakai dan Merawat Pakaian</div></div><div class="mgrid">'+
      T.map(function(t){return '<button class="tile" data-k="'+t[0]+'" style="background:'+t[4]+'"><span class="te">'+t[1]+'</span>'+t[2]+'<small>'+t[3]+'</small></button>';}).join("")+'</div>';
    Array.prototype.forEach.call(v.querySelectorAll(".tile"),function(b){
      b.addEventListener("click",function(){
        var k=b.dataset.k;
        if(navLock)return;
        if(k==="rank")showRank(); else if(k==="dev")showDev(); else startSec(k);
      });
    });
    speak("Halo "+player+"! Pilih menu yang kamu suka.");
  });
}
function showRank(){
  swap(function(v){
    setMode("single"); navMode="single"; cur=null; setHdr("Papan Peringkat");
    var a=loadR().slice().sort(function(x,y){
      var tx=(x.l||0)+(x.m||0), ty=(y.l||0)+(y.m||0);
      return ty-tx||x.n.localeCompare(y.n);
    });
    var med=["🥇","🥈","🥉"];
    var rows=a.map(function(r,i){
      return '<tr'+(r.n.toLowerCase()===player.toLowerCase()?' class="me"':'')+'><td>'+(med[i]||(i+1))+'</td><td class="nm">'+r.n+'</td><td>'+(r.l===null?"-":r.l)+'</td><td>'+(r.m===null?"-":r.m)+'</td><td>'+((r.l||0)+(r.m||0))+'</td></tr>';
    }).join("");
    v.innerHTML='<div class="card"><h2>🏆 Papan Peringkat</h2><table><thead><tr><th>No</th><th>Nama</th><th>Literasi</th><th>Numerasi</th><th>Total</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5">Belum ada peserta.</td></tr>')+'</tbody></table></div>';
    $("#bBack").classList.remove("off");
  });
}
window.devErr=function(img){
  var n=+img.dataset.n||0, ex=["jpg","jpeg","png"];
  if(n<ex.length-1){ img.dataset.n=n+1; img.src="./assets/pengembang."+ex[n+1]; }
  else { var d=document.createElement("div"); d.className="devphoto"; d.textContent="👩‍🏫"; img.parentNode.replaceChild(d,img); }
};
function showDev(){
  swap(function(v){
    setMode("single"); navMode="single"; cur=null; setHdr("Pengembang");
    v.innerHTML='<div class="card"><div class="devwrap"><img class="devphoto" data-n="0" src="./assets/pengembang.jpg" alt="Foto pengembang" onerror="devErr(this)"><div class="devtxt"><h2>Pengembang</h2><p>Ade Suminarsih, S.Pd.</p><p>PKBM Amanah Kita</p></div></div></div>';
    $("#bBack").classList.remove("off");
  });
}

/* ---------- mulai ---------- */
showCover();
})();
</script>
